services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agrovision
      POSTGRES_USER: agrovision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AgroVisionLocal2026}
    ports:
      - "5434:5432"
    volumes:
      - agrovision_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrovision -d agrovision"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  agrovision_pgdata:
